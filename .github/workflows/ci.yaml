---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - 'renovate/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  workflows:
    uses: casse-boubou/ha-addon-workflows/.github/workflows/app-ci.yaml@079177fd2a0c3e913c7c0b343c124e4f5ff3f82b # main
